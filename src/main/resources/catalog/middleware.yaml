schemaVersion: 1
revision: "2026-10-10.2"
kinds:
  mysql:
    defaultVersion: "8.0"
    versions:
      - version: "5.7"
        image: mysql:5.7
        containerPort: 3306
        env:
          MYSQL_ROOT_PASSWORD: sentinel
          MYSQL_DATABASE: test
        readiness:
          type: tcp
          port: 3306
          startupGraceSeconds: 20
        resources:
          memoryMb: 512
          cpu: 0.5
      - version: "8.0"
        aliases: ["8"]
        image: mysql:8.0
        containerPort: 3306
        env:
          MYSQL_ROOT_PASSWORD: sentinel
          MYSQL_DATABASE: test
        readiness:
          type: tcp
          port: 3306
          startupGraceSeconds: 20
        resources:
          memoryMb: 512
          cpu: 0.5
  redis:
    defaultVersion: "7"
    versions:
      - version: "6.2"
        image: redis:6.2-alpine
        containerPort: 6379
        env: {}
        readiness:
          type: tcp
          port: 6379
          startupGraceSeconds: 5
        resources:
          memoryMb: 128
          cpu: 0.25
      - version: "7"
        aliases: ["7.0", "7.2"]
        image: redis:7-alpine
        containerPort: 6379
        env: {}
        readiness:
          type: tcp
          port: 6379
          startupGraceSeconds: 5
        resources:
          memoryMb: 128
          cpu: 0.25
  postgres:
    defaultVersion: "16"
    versions:
      - version: "15"
        image: postgres:15-alpine
        containerPort: 5432
        env:
          POSTGRES_PASSWORD: sentinel
        readiness:
          type: tcp
          port: 5432
          startupGraceSeconds: 10
        resources:
          memoryMb: 256
          cpu: 0.5
      - version: "16"
        image: postgres:16-alpine
        containerPort: 5432
        env:
          POSTGRES_PASSWORD: sentinel
        readiness:
          type: tcp
          port: 5432
          startupGraceSeconds: 10
        resources:
          memoryMb: 256
          cpu: 0.5
  mongodb:
    defaultVersion: "7"
    versions:
      - version: "6"
        image: mongo:6
        containerPort: 27017
        env: {}
        readiness:
          type: tcp
          port: 27017
          startupGraceSeconds: 15
        resources:
          memoryMb: 512
          cpu: 0.5
      - version: "7"
        image: mongo:7
        containerPort: 27017
        env: {}
        readiness:
          type: tcp
          port: 27017
          startupGraceSeconds: 15
        resources:
          memoryMb: 512
          cpu: 0.5
  rabbitmq:
    defaultVersion: "3.13"
    versions:
      - version: "3.13"
        image: rabbitmq:3.13-management-alpine
        containerPort: 5672
        env:
          RABBITMQ_DEFAULT_USER: sentinel
          RABBITMQ_DEFAULT_PASS: sentinel
        readiness:
          type: tcp
          port: 5672
          startupGraceSeconds: 20
        resources:
          memoryMb: 512
          cpu: 0.5
  nginx:
    defaultVersion: "1.27"
    versions:
      - version: "1.25"
        image: nginx:1.25-alpine
        containerPort: 80
        env: {}
        readiness:
          type: tcp
          port: 80
          startupGraceSeconds: 3
        resources:
          memoryMb: 64
          cpu: 0.25
      - version: "1.27"
        image: nginx:1.27-alpine
        containerPort: 80
        env: {}
        readiness:
          type: tcp
          port: 80
          startupGraceSeconds: 3
        resources:
          memoryMb: 64
          cpu: 0.25
  kafka:
    defaultVersion: "3.7"
    versions:
      - version: "3.7"
        image: apache/kafka:3.7.0
        containerPort: 9092
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          # ${HOST}、${HOST_PORT} 在分配主机端口后替换。容器内仍绑定 9092。
          KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://${HOST}:${HOST_PORT}"
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
          CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
        readiness:
          type: tcp
          port: 9092
          startupGraceSeconds: 25
        resources:
          memoryMb: 1024
          cpu: 1
