# ============================================================================
# Sentinel - 测试环境配置
# ============================================================================

spring:
  # 数据库配置
  datasource:
    url: jdbc:mysql://${DB_HOST:test-db-server}:3306/sentinel_test?useUnicode=true&characterEncoding=utf8&useSSL=true&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME:sentinel_test}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:test-redis-server}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 1
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: -1ms

  # SQL 初始化（测试环境不自动初始化）
  sql:
    init:
      mode: never

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.sentinel.domain
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（测试环境）
jwt:
  secret: ${JWT_SECRET}
  expiration: 43200000  # 12小时
  refresh-expiration: 259200000  # 3天

# 安全配置（测试环境）
security:
  login-attempt:
    max-attempts: 5
    lock-time-minutes: 10
  cors:
    allowed-origins:
      - https://test.sentinel.example.com
      - http://test-frontend:3000

# 缓存配置（测试环境）
cache:
  diagnosis-ttl: 43200  # 12小时
  metrics-ttl: 180  # 3分钟
  token-blacklist-ttl: 43200  # 12小时
  key-prefix: "sentinel:test:"

# AI 配置（测试环境 - 默认本地 Ollama，可用 AI_PROVIDER_ORDER 覆盖）
ai:
  provider-order: ${AI_PROVIDER_ORDER:${AI_PROVIDER:ollama}}
  providers:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://test-ollama:11434}
      model: ${OLLAMA_MODEL:qwen2.5:7b}
      timeout: 120

# Docker 配置（测试环境）
docker:
  host: ${DOCKER_HOST:unix:///var/run/docker.sock}
  api-version: "1.41"
  tls-verify: ${DOCKER_TLS_VERIFY:false}
  connection-timeout: 30
  response-timeout: 60
  container:
    default-network: sentinel-test-network
    name-prefix: sentinel-test-
    memory-limit: 1024
    cpu-limit: 2.0

# 日志配置（测试环境 - INFO 级别）
logging:
  level:
    root: INFO
    com.sentinel: INFO
    com.baomidou.mybatisplus: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: /var/log/sentinel/sentinel-test.log
    max-size: 200MB
    max-history: 60

# ============================================================================
# 任务生命周期（测试关闭自动供给和自动诊断，避免碰 Docker / AI）
# 回收与补扫间隔拉长，且首次执行同样延后，上下文启动时不会立刻跑定时任务。
# ============================================================================
sentinel:
  security:
    # 测试默认关闭。单个测试可设置 sentinel.security.credential-check 打开。
    # off 必须加引号，YAML 1.1 会把不加引号的 off 解析成布尔 false。
    credential-check: "off"
  lifecycle:
    auto-provision: false
    auto-diagnose: false
    failed-retention: 30m
    pending-sweep-interval: 24h
    reaper-interval: 24h
  provisioning:
    ttl: 2h
    port-range: "30000-39999"
    pull-missing: true
    pull-timeout: 5m
    ready-timeout: 90s
    host: localhost
    limits:
      max-active-environments: 10
      max-containers: 30
    # 依赖以 catalog/middleware.yaml 为准。覆盖默认版本时再写 dependencies.<kind>。

  # 测试不采样，避免访问 Docker。间隔拉长，启动后不会立刻调度。
  monitoring:
    resource-usage:
      enabled: false
      interval: 24h
      read-timeout: 5s
      max-environments-per-pass: 200
      parallelism: 4