# ============================================================================
# Sentinel 智能测试环境管理系统 - 通用配置
# ============================================================================

spring:
  application:
    name: sentinel

  # 可选加载项目根目录 .env（KEY=VALUE）。本地 spring-boot:run 从此注入 JWT_SECRET 等。
  config:
    import: "optional:file:.env[.properties]"

  # 激活的配置文件（dev/test/prod）
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  
  # 禁用 Docker Compose 自动配置
  docker:
    compose:
      enabled: false

# ============================================================================
# 服务器配置
# ============================================================================
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  # 请求超时时间（毫秒）
  connection-timeout: 30000

# ============================================================================
# JWT 配置
# ============================================================================
jwt:
  # JWT 密钥（必需，无默认值）。长度至少 32 个字符，通过环境变量 JWT_SECRET 或 .env 注入。
  secret: ${JWT_SECRET}
  # 访问令牌过期时间（毫秒，默认24小时）
  expiration: ${JWT_EXPIRATION:86400000}
  # 刷新令牌过期时间（毫秒，默认7天）
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  # Token 发行者
  issuer: sentinel
  # Token 受众
  audience: sentinel-users
  # Token 请求头名称
  header: Authorization
  # Token 前缀
  token-prefix: "Bearer "

# ============================================================================
# 安全配置
# ============================================================================
security:
  # 登录尝试配置
  login-attempt:
    # 最大登录尝试次数
    max-attempts: ${SECURITY_MAX_ATTEMPTS:5}
    # 账户锁定时间（分钟）
    lock-time-minutes: ${SECURITY_LOCK_TIME:15}
  
  # CORS 配置
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8080
    allowed-methods:
      - GET
      - POST
      - PUT
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    allow-credentials: true
    max-age: 3600

# ============================================================================
# 缓存配置
# ============================================================================
cache:
  # AI 诊断缓存 TTL（秒，默认24小时）
  diagnosis-ttl: ${CACHE_DIAGNOSIS_TTL:86400}
  # 系统指标缓存 TTL（秒，默认5分钟）
  metrics-ttl: ${CACHE_METRICS_TTL:300}
  # Token 黑名单缓存 TTL（秒，默认24小时）
  token-blacklist-ttl: ${CACHE_TOKEN_BLACKLIST_TTL:86400}
  # 缓存键前缀
  key-prefix: ${CACHE_KEY_PREFIX:sentinel:}

# ============================================================================
# AI 服务配置
# ============================================================================
ai:
  # 逗号分隔，前者优先。未设置 AI_PROVIDER_ORDER 时回退到旧的 AI_PROVIDER。
  provider-order: ${AI_PROVIDER_ORDER:${AI_PROVIDER:ollama}}

  # 每个提供商还可选 timeout（秒，默认 60）、max-tokens（默认 2000）、temperature（默认 0.3）、enabled（默认 true）
  providers:
    ollama:
      protocol: ollama
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:qwen2.5:7b}
      timeout: ${OLLAMA_TIMEOUT:120}
    openai:
      protocol: openai
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
    anthropic:
      protocol: anthropic
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${ANTHROPIC_API_KEY:}
      model: ${ANTHROPIC_MODEL:claude-sonnet-4-5}
    deepseek:
      protocol: openai
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-flash}
      # deepseek-flash 会先推理。默认关掉，避免思考占满 max-tokens 后正文为空。
      thinking: ${DEEPSEEK_THINKING:disabled}
    deepseek-anthropic:
      protocol: anthropic
      base-url: https://api.deepseek.com/anthropic
      api-key: ${DEEPSEEK_API_KEY:}
      model: ${DEEPSEEK_MODEL:deepseek-flash}
      thinking: ${DEEPSEEK_THINKING:disabled}
    custom:
      protocol: ${CUSTOM_AI_PROTOCOL:openai}
      base-url: ${CUSTOM_AI_BASE_URL:}
      api-key: ${CUSTOM_AI_API_KEY:}
      model: ${CUSTOM_AI_MODEL:}

# ============================================================================
# Docker 配置
# ============================================================================
docker:
  # Docker 主机地址
  host: ${DOCKER_HOST:unix:///var/run/docker.sock}
  # Docker API 版本
  api-version: ${DOCKER_API_VERSION:1.41}
  # 是否启用 TLS 验证
  tls-verify: ${DOCKER_TLS_VERIFY:false}
  # TLS 证书路径
  cert-path: ${DOCKER_CERT_PATH:}
  # 连接超时时间（秒）
  connection-timeout: ${DOCKER_CONNECTION_TIMEOUT:30}
  # 响应超时时间（秒）
  response-timeout: ${DOCKER_RESPONSE_TIMEOUT:60}
  
  # 容器配置
  container:
    default-network: sentinel-network
    name-prefix: sentinel-
    memory-limit: 512
    cpu-limit: 1.0
    auto-remove: false
    restart-policy: unless-stopped

# ============================================================================
# Actuator 监控配置
# ============================================================================
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

# ============================================================================
# Swagger/OpenAPI 配置
# ============================================================================
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# ============================================================================
# 日志配置
# ============================================================================
logging:
  level:
    root: INFO
    com.sentinel: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ============================================================================
# 任务生命周期
# ============================================================================
sentinel:
  security:
    # fail 拒绝启动，warn 每个问题一条 WARN，off 不检查。
    # prod=fail，dev 与默认=warn，test=off。可用 --sentinel.security.credential-check= 覆盖。
    credential-check: "warn"
    # 非空时启动把 admin 密码设为该值的 BCrypt；没有 admin 则创建，角色 ADMIN。
    # 环境变量名是 SENTINEL_ADMIN_PASSWORD。长度至少 12，否则拒绝启动。
    admin-password: "${SENTINEL_ADMIN_PASSWORD:}"
  lifecycle:
    # 创建任务后自动供给环境
    auto-provision: true
    # 任务失败后自动请求诊断
    auto-diagnose: true
    # 失败环境保留时间，供查看现场
    failed-retention: 30m
    # 补扫遗漏 PENDING 任务的间隔
    pending-sweep-interval: 30s
    # 过期环境回收间隔
    reaper-interval: 60s
  # 按任务依赖启动容器。未写到这里的依赖仍使用代码里的内置目录。
  provisioning:
    ttl: 2h
    port-range: "30000-39999"
    pull-missing: true
    pull-timeout: 5m
    ready-timeout: 90s
    host: localhost
    # 容器端口只发布到本机，环境内数据库为固定弱口令
    bind-address: ${SENTINEL_PROVISIONING_BIND_ADDRESS:127.0.0.1}
    dependencies:
      mysql:
        image: mysql:8.0
        port: 3306
        env:
          MYSQL_ROOT_PASSWORD: sentinel
          MYSQL_DATABASE: test
      redis:
        image: redis:7-alpine
        port: 6379
      postgres:
        image: postgres:16-alpine
        port: 5432
        env:
          POSTGRES_PASSWORD: sentinel
      mongodb:
        image: mongo:7
        port: 27017
      rabbitmq:
        image: rabbitmq:3-management-alpine
        port: 5672
      nginx:
        image: nginx:alpine
        port: 80

  # 运行中容器的 CPU、内存采样
  monitoring:
    resource-usage:
      enabled: true
      interval: 30s
      read-timeout: 5s
      max-environments-per-pass: 200
      parallelism: 4
