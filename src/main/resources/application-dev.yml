# ============================================================================
# Sentinel - 开发环境配置
# ============================================================================

spring:
  # 数据库配置
  datasource:
    url: jdbc:mysql://localhost:3306/sentinel?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  # SQL 初始化
  sql:
    init:
      mode: never  # 改为 never，避免重复创建表
      schema-locations: classpath:schema.sql
      continue-on-error: false

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.sentinel.domain
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（开发环境）
# 密钥不在此硬编码，统一走 application.yml 的 ${JWT_SECRET}（至少 32 个字符）
jwt:
  expiration: 86400000  # 24小时
  refresh-expiration: 604800000  # 7天

# 安全配置（开发环境 - 较宽松）
security:
  login-attempt:
    max-attempts: 10  # 开发环境允许更多尝试
    lock-time-minutes: 5  # 开发环境锁定时间较短
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8080
      - http://127.0.0.1:3000
      - http://127.0.0.1:8080

# 缓存配置（开发环境 - 较短 TTL）
cache:
  diagnosis-ttl: 3600  # 1小时
  metrics-ttl: 60  # 1分钟
  token-blacklist-ttl: 3600  # 1小时
  key-prefix: "sentinel:dev:"

# AI 配置（开发环境 - 使用本地 Ollama）
ai:
  provider-order: ${AI_PROVIDER_ORDER:${AI_PROVIDER:ollama}}
  providers:
    ollama:
      base-url: http://localhost:11434
      model: qwen2.5:7b
      timeout: 120

# Docker 配置（开发环境）
docker:
  host: unix:///var/run/docker.sock
  api-version: "1.41"
  tls-verify: false
  connection-timeout: 30
  response-timeout: 60
  container:
    default-network: sentinel-dev-network
    name-prefix: sentinel-dev-
    memory-limit: 512
    cpu-limit: 1.0

# 日志配置（开发环境）。Mapper 保持 INFO，避免 DEBUG SQL 把密码哈希打进参数日志。
logging:
  level:
    root: INFO
    com.sentinel: DEBUG
    com.sentinel.mapper: INFO
    com.baomidou.mybatisplus: INFO
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: logs/sentinel-dev.log
    max-size: 100MB
    max-history: 30

# ============================================================================
# 任务生命周期（开发环境）
# ============================================================================
sentinel:
  security:
    # 开发环境只告警，不因种子口令拒绝启动
    credential-check: "warn"
  lifecycle:
    auto-provision: true
    auto-diagnose: true
    failed-retention: 30m
    pending-sweep-interval: 30s
    reaper-interval: 60s
  provisioning:
    ttl: 2h
    port-range: "30000-39999"
    pull-missing: true
    pull-timeout: 5m
    ready-timeout: 90s
    host: localhost
    # 依赖以 catalog/middleware.yaml 为准。覆盖默认版本时再写 dependencies.<kind>。

  # 运行中容器的 CPU、内存采样
  monitoring:
    resource-usage:
      enabled: true
      interval: 30s
      read-timeout: 5s
      max-environments-per-pass: 200
      parallelism: 4
